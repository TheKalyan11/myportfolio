<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Pixel art canvas with a palette and a pencil">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f4f4"/><stop offset="1" stop-color="#d6d6d6"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/></filter>
    <pattern id="chk" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="#fafafa"/><rect width="40" height="40" fill="#e4e4e4"/><rect x="40" y="40" width="40" height="40" fill="#e4e4e4"/></pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g fill="#fff" opacity="0.55"><rect x="90" y="110" width="26" height="26"/><rect x="1050" y="140" width="26" height="26"/><rect x="1010" y="760" width="26" height="26"/><rect x="130" y="730" width="26" height="26"/><rect x="590" y="70" width="18" height="18"/></g>
  <g filter="url(#sh)">
    <rect x="270" y="130" width="660" height="640" rx="36" fill="#0a0a0a"/>
    <rect x="310" y="170" width="560" height="560" rx="10" fill="url(#chk)"/>
  </g>
  <!-- the pixel heart, 14 x 14 cells of 40px starting at (310,170) -->
  <g fill="#ff3d6e">
    <rect x="390" y="250" width="120" height="40"/><rect x="630" y="250" width="120" height="40"/>
    <rect x="350" y="290" width="200" height="40"/><rect x="590" y="290" width="200" height="40"/>
    <rect x="350" y="330" width="440" height="40"/><rect x="350" y="370" width="440" height="40"/>
    <rect x="390" y="410" width="360" height="40"/><rect x="430" y="450" width="280" height="40"/>
    <rect x="470" y="490" width="200" height="40"/><rect x="510" y="530" width="120" height="40"/>
  </g>
  <g fill="#ff9fb8"><rect x="390" y="290" width="40" height="40"/><rect x="390" y="330" width="40" height="40"/></g>
  <g fill="#b3123f"><rect x="590" y="410" width="160" height="40"/><rect x="590" y="450" width="120" height="40"/><rect x="590" y="490" width="80" height="40"/></g>
  <g fill="#fff"><rect x="430" y="290" width="40" height="40"/></g>
  <g stroke="#0a0a0a" stroke-opacity="0.12" stroke-width="2"><path d="M350 170V730M390 170V730M430 170V730M470 170V730M510 170V730M550 170V730M590 170V730M630 170V730M670 170V730M710 170V730M750 170V730M790 170V730M830 170V730M310 210H870M310 250H870M310 290H870M310 330H870M310 370H870M310 410H870M310 450H870M310 490H870M310 530H870M310 570H870M310 610H870M310 650H870M310 690H870"/></g>
  <!-- palette -->
  <g filter="url(#sh)">
    <rect x="80" y="300" width="150" height="330" rx="28" fill="#fff"/>
    <g>
      <rect x="104" y="326" width="48" height="48" rx="12" fill="#0a0a0a"/><rect x="158" y="326" width="48" height="48" rx="12" fill="#ffffff"/>
      <rect x="104" y="384" width="48" height="48" rx="12" fill="#3d3d3d"/><rect x="158" y="384" width="48" height="48" rx="12" fill="#7a7a7a"/>
      <rect x="104" y="442" width="48" height="48" rx="12" fill="#bdbdbd"/><rect x="158" y="442" width="48" height="48" rx="12" fill="#0a0a0a"/>
      <rect x="104" y="500" width="48" height="48" rx="12" fill="#9a9a9a"/><rect x="158" y="500" width="48" height="48" rx="12" fill="#0a0a0a"/>
      <rect x="104" y="558" width="102" height="48" rx="12" fill="#d0d0d0"/>
    </g>
  </g>
  <!-- pencil -->
  <g filter="url(#sh)" transform="rotate(38 960 560)">
    <rect x="930" y="330" width="60" height="300" rx="8" fill="#ffffff"/>
    <rect x="930" y="330" width="60" height="44" rx="8" fill="#0a0a0a"/>
    <rect x="930" y="386" width="60" height="18" fill="#bdbdbd"/>
    <path d="M930 630 L960 700 L990 630Z" fill="#e8e8e8"/>
    <path d="M948 672 L960 700 L972 672Z" fill="#0a0a0a"/>
  </g>
</svg>
