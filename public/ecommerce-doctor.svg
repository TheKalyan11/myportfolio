<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="An online store, a doctor appointment screen and a code window">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c9a6"/>
      <stop offset="0.55" stop-color="#e7e1c9"/>
      <stop offset="1" stop-color="#8fb3a3"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#2a170f" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g fill="#fff" opacity="0.45"><rect x="70" y="90" width="22" height="22"/><rect x="1090" y="120" width="22" height="22"/><rect x="1040" y="700" width="22" height="22"/><rect x="110" y="680" width="22" height="22"/></g>

  <!-- code window (back, right) -->
  <g filter="url(#sh)" transform="rotate(3 880 300)">
    <rect x="640" y="90" width="430" height="300" rx="22" fill="#14100e"/>
    <circle cx="676" cy="124" r="7" fill="#ff5f57"/><circle cx="702" cy="124" r="7" fill="#febc2e"/><circle cx="728" cy="124" r="7" fill="#28c840"/>
    <g stroke-linecap="round" stroke-width="12">
      <path d="M676 176H760" stroke="#e63b2e"/><path d="M776 176H900" stroke="#d9cdb9"/>
      <path d="M700 212H820" stroke="#f5b942"/><path d="M836 212H940" stroke="#d9cdb9"/>
      <path d="M700 248H780" stroke="#3aa17e"/><path d="M796 248H980" stroke="#d9cdb9"/>
      <path d="M676 284H720" stroke="#e63b2e"/><path d="M736 284H860" stroke="#7a6f64"/>
      <path d="M700 320H900" stroke="#7a6f64"/><path d="M676 356H744" stroke="#f5b942"/>
    </g>
  </g>

  <!-- doctor appointment card (back, left) -->
  <g filter="url(#sh)" transform="rotate(-4 300 560)">
    <rect x="90" y="360" width="380" height="330" rx="26" fill="#fbf7ea"/>
    <circle cx="160" cy="430" r="40" fill="#3aa17e"/>
    <path d="M160 410v40M140 430h40" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
    <rect x="224" y="410" width="160" height="14" rx="7" fill="#1a1210"/>
    <rect x="224" y="436" width="104" height="12" rx="6" fill="#d9cdb9"/>
    <g fill="#efe6d6">
      <rect x="120" y="500" width="62" height="56" rx="14"/><rect x="194" y="500" width="62" height="56" rx="14"/>
      <rect x="268" y="500" width="62" height="56" rx="14"/><rect x="342" y="500" width="62" height="56" rx="14"/>
    </g>
    <rect x="194" y="500" width="62" height="56" rx="14" fill="#3aa17e"/>
    <path d="M214 528l10 10 18-20" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="120" y="590" width="284" height="56" rx="28" fill="#1a1210"/>
    <rect x="190" y="612" width="144" height="12" rx="6" fill="#fbf7ea"/>
  </g>

  <!-- online store (front, centre) -->
  <g filter="url(#sh)">
    <rect x="360" y="170" width="480" height="470" rx="26" fill="#fff"/>
    <rect x="360" y="170" width="480" height="64" rx="26" fill="#14100e"/>
    <rect x="360" y="208" width="480" height="26" fill="#14100e"/>
    <rect x="392" y="194" width="96" height="14" rx="7" fill="#fbf7ea"/>
    <g fill="none" stroke="#fbf7ea" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M772 190h8l10 28h30l8-20h-44"/>
    </g>
    <g fill="#fbf7ea"><circle cx="792" cy="226" r="4"/><circle cx="818" cy="226" r="4"/></g>
    <circle cx="830" cy="186" r="13" fill="#e63b2e"/>
    <text x="830" y="191" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">2</text>

    <rect x="392" y="262" width="196" height="196" rx="18" fill="#fde3d8"/>
    <rect x="612" y="262" width="196" height="196" rx="18" fill="#e1efe5"/>
    <!-- bottle -->
    <rect x="466" y="320" width="48" height="104" rx="14" fill="#e63b2e"/>
    <rect x="478" y="296" width="24" height="26" rx="6" fill="#14100e"/>
    <rect x="474" y="352" width="32" height="26" rx="5" fill="#fbf7ea"/>
    <!-- box -->
    <rect x="666" y="326" width="88" height="96" rx="12" fill="#1a1210"/>
    <rect x="698" y="326" width="24" height="96" fill="#e63b2e"/>
    <rect x="672" y="316" width="76" height="16" rx="8" fill="#3a2f28"/>

    <rect x="392" y="480" width="130" height="12" rx="6" fill="#1a1210"/>
    <rect x="612" y="480" width="150" height="12" rx="6" fill="#1a1210"/>
    <text x="392" y="522" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1a1210">&#8377;499</text>
    <text x="612" y="522" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1a1210">&#8377;799</text>
    <circle cx="560" cy="566" r="26" fill="#e63b2e"/>
    <path d="M560 552v28M546 566h28" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="780" cy="566" r="26" fill="#14100e"/>
    <path d="M780 552v28M766 566h28" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
